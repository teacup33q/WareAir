<!DOCTYPE HTML>
<html>
	<head>
		<title>Thank You | Damien Ware</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			.thankyou-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				text-align: center;
				padding: 2em;
			}
			.thankyou-wrap .icon-circle {
				width: 80px;
				height: 80px;
				border-radius: 50%;
				background: rgba(255,255,255,0.1);
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0 auto 1.5em;
				font-size: 2em;
			}
			.thankyou-wrap h1 {
				font-size: 2.5em;
				margin-bottom: 0.4em;
			}
			.thankyou-wrap p {
				font-size: 1.1em;
				opacity: 0.8;
				max-width: 480px;
				margin: 0 auto 2em;
			}
		</style>
	</head>
	<body class="is-preload">
		<div id="wrapper">
			<div id="main">
				<section>
					<div class="container">
						<div class="thankyou-wrap">
							<div class="icon-circle">
								<span class="icon solid fa-paper-plane"></span>
							</div>
							<h1>Message Received</h1>
							<p>Thanks for reaching out. I'll review your message and get back to you as soon as possible — typically within 24–48 hours.</p>
							<a href="index.html" class="button primary">Back to Home</a>
						</div>
					</div>
				</section>
			</div>
		</div>
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
	</body>
</html>
