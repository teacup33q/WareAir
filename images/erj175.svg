<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background:#1a1f2e">
  <rect width="800" height="450" fill="#141926"/>
  <g transform="translate(400,225)" fill="#c8d8f0" opacity="0.92">
    <!-- Fuselage - regional jet, longer -->
    <ellipse cx="5" cy="0" rx="225" ry="21" fill="#b0c4de"/>
    <path d="M230,0 Q260,-8 275,0 Q260,8 230,0" fill="#c8d8f0"/>
    <path d="M-220,0 Q-240,-4 -255,0 Q-240,4 -220,0" fill="#c8d8f0"/>
    <!-- Wings - under wing mounted -->
    <path d="M40,0 L-30,-92 L-55,-95 L-52,-78 L-15,0 L-52,78 L-55,95 L-30,92 Z" fill="#a0b8d8"/>
    <!-- Winglets -->
    <path d="M-30,-92 L-38,-110 L-30,-105 L-22,-92" fill="#8098b8"/>
    <path d="M-30,92 L-38,110 L-30,105 L-22,92" fill="#8098b8"/>
    <!-- H-stab -->
    <path d="M-185,0 L-215,-35 L-228,-35 L-225,-28 L-198,0 L-225,28 L-228,35 L-215,35 Z" fill="#90a8c8"/>
    <!-- V-tail -->
    <path d="M-200,-2 L-238,-52 L-246,-52 L-242,-42 L-200,0" fill="#90a8c8"/>
    <!-- Underwing engines -->
    <ellipse cx="-5" cy="-112" rx="25" ry="7" fill="#6080a0"/>
    <ellipse cx="-5" cy="112" rx="25" ry="7" fill="#6080a0"/>
    <!-- Windows - two rows (regional jet) -->
    <rect x="-120" y="-7" width="300" height="4" rx="2" fill="#4a6080" opacity="0.6"/>
  </g>
  <text x="400" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7090b8" letter-spacing="3">EMBRAER 175</text>
</svg>