<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background:#1a1f2e">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2744"/><stop offset="100%" stop-color="#0d1420"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- Falcon 8X side silhouette -->
  <g transform="translate(400,225) scale(1.1)" fill="#c8d8f0" opacity="0.92">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="210" ry="22" fill="#b0c4de"/>
    <!-- Nose -->
    <path d="M210,0 Q240,-8 255,0 Q240,8 210,0" fill="#c8d8f0"/>
    <!-- Tail -->
    <path d="M-210,0 Q-230,-5 -250,0 Q-230,5 -210,0" fill="#c8d8f0"/>
    <!-- Main wings -->
    <path d="M30,0 L-60,-105 L-90,-108 L-85,-90 L-40,0 L-85,90 L-90,108 L-60,105 Z" fill="#a0b8d8"/>
    <!-- Horizontal stabilizer -->
    <path d="M-175,0 L-215,-42 L-230,-43 L-228,-35 L-195,0 L-228,35 L-230,43 L-215,42 Z" fill="#90a8c8"/>
    <!-- Vertical tail -->
    <path d="M-190,-2 L-230,-55 L-240,-55 L-235,-45 L-190,0" fill="#90a8c8"/>
    <!-- 3 engines (trijet) -->
    <ellipse cx="-50" cy="-120" rx="22" ry="7" fill="#7090b0"/>
    <ellipse cx="-50" cy="120" rx="22" ry="7" fill="#7090b0"/>
    <ellipse cx="-210" cy="-8" rx="20" ry="6" fill="#7090b0"/>
    <!-- Windows -->
    <rect x="-60" y="-8" width="220" height="5" rx="2" fill="#4a6080" opacity="0.6"/>
  </g>
  <text x="400" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7090b8" letter-spacing="3">DASSAULT FALCON 8X</text>
</svg>